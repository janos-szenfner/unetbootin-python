name: Release

on:
  push:
    tags:
      - 'v*'
  # Allow running the build jobs manually from the Actions tab (for validating
  # a build without cutting a release). NOTE: the GitHub Release itself is only
  # created on a tag push — see the `create-release` job's `if:` guard.
  workflow_dispatch:

# Cancel previous runs on same branch
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every build bundles its own Python and Tk, so they all use the same one.
  # 3.12 rather than 3.10 because 3.10 ships Tk 8.6.12 (2021), whose Aqua
  # mouse handling breaks clicks on current macOS; the same version everywhere
  # keeps the platforms comparable when something has to be diagnosed.
  PYTHON_VERSION: '3.12'
  APP_NAME: 'pynetboot'
  
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check __version__ matches the tag
        # The About dialog and the frozen app read __version__ from source, so
        # a drifting constant would display the wrong version. The DEB/RPM take
        # their version from the tag, so these must agree.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynetboot/__init__.py)"
          echo "tag=$TAG  __version__=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::__version__ ($VER) does not match tag ($TAG)"
            exit 1
          fi

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version
        # The built files carry the version, the way the DEB and RPM do: from
        # the tag on a release, from the packaged __version__ otherwise.
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynetboot/__init__.py)"
          fi
          echo "VER=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "Artifacts will be named after version ${VER:-0.0.0}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.0.0

      - name: Verify GUI toolkit is bundled and usable
        shell: bash
        # CustomTkinter paints on canvases that need Tk 8.6; on older Tk the
        # window opens but stays blank. Fail the build here rather than ship a
        # binary that shows an empty window.
        run: |
          python - <<'PYEOF'
          import os, platform, sys, tkinter
          import customtkinter
          patchlevel = tkinter.Tcl().call('info', 'patchlevel')
          python_version = platform.python_version()
          print(f"python {python_version}  Tk {patchlevel}  "
                f"customtkinter {customtkinter.__version__}")
          # Every job writes the same row, so one glance at the run summary
          # shows whether the platforms bundled the same libraries.
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as handle:
                  handle.write(
                      f"### Toolkit bundled on {os.environ.get('RUNNER_OS', '?')}\n\n"
                      f"| python | Tk | customtkinter |\n|---|---|---|\n"
                      f"| {python_version} | {patchlevel} "
                      f"| {customtkinter.__version__} |\n")
          if tuple(int(n) for n in patchlevel.split('.')) < (8, 6, 13):
              print(f"::warning::Bundled Tk is {patchlevel}; 8.6.13+ is wanted "
                    f"for Aqua mouse handling on macOS")
          if float(tkinter.TkVersion) < 8.6:
              sys.exit(f"Tk 8.6+ required, found {tkinter.TkVersion}")
          PYEOF
          # The TLS stack gets bundled into the artifact, so record which one
          # and flag the combination urllib3 v2 does not support.
          python -c "import ssl, urllib3; b = ssl.OPENSSL_VERSION; print('TLS backend:', b, '| urllib3', urllib3.__version__); print('::warning::Bundled TLS backend is ' + b + ', which urllib3 v2 does not fully support (needs OpenSSL 1.1.1+)') if ('LibreSSL' in b or b < 'OpenSSL 1.1.1') else print('TLS backend OK')"

      - name: Build with PyInstaller
        # A .spec file already encodes onefile/windowed/name, so only
        # spec-compatible flags may be passed. Single line = PowerShell-safe.
        # The UAC "requireAdministrator" manifest is embedded by the spec
        # (uac_admin=True), so no post-build mt.exe step is needed.
        run: pyinstaller pynetboot-windows.spec --noconfirm --clean --distpath dist/windows

      - name: Name the EXE after the version
        shell: bash
        run: mv "dist/windows/${{ env.APP_NAME }}.exe" "dist/windows/${{ env.APP_NAME }}-${VER}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/windows/${{ env.APP_NAME }}-*.exe
          retention-days: 14

  build-macos:
    name: Build macOS App (Apple Silicon)
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version
        # The built files carry the version, the way the DEB and RPM do: from
        # the tag on a release, from the packaged __version__ otherwise.
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynetboot/__init__.py)"
          fi
          echo "VER=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "Artifacts will be named after version ${VER:-0.0.0}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.0.0

      - name: Verify GUI toolkit is bundled and usable
        shell: bash
        # CustomTkinter paints on canvases that need Tk 8.6; on older Tk the
        # window opens but stays blank. Fail the build here rather than ship a
        # binary that shows an empty window.
        run: |
          python - <<'PYEOF'
          import os, platform, sys, tkinter
          import customtkinter
          patchlevel = tkinter.Tcl().call('info', 'patchlevel')
          python_version = platform.python_version()
          print(f"python {python_version}  Tk {patchlevel}  "
                f"customtkinter {customtkinter.__version__}")
          # Every job writes the same row, so one glance at the run summary
          # shows whether the platforms bundled the same libraries.
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as handle:
                  handle.write(
                      f"### Toolkit bundled on {os.environ.get('RUNNER_OS', '?')}\n\n"
                      f"| python | Tk | customtkinter |\n|---|---|---|\n"
                      f"| {python_version} | {patchlevel} "
                      f"| {customtkinter.__version__} |\n")
          if tuple(int(n) for n in patchlevel.split('.')) < (8, 6, 13):
              print(f"::warning::Bundled Tk is {patchlevel}; 8.6.13+ is wanted "
                    f"for Aqua mouse handling on macOS")
          if float(tkinter.TkVersion) < 8.6:
              sys.exit(f"Tk 8.6+ required, found {tkinter.TkVersion}")
          PYEOF
          # The TLS stack gets bundled into the artifact, so record which one
          # and flag the combination urllib3 v2 does not support.
          python -c "import ssl, urllib3; b = ssl.OPENSSL_VERSION; print('TLS backend:', b, '| urllib3', urllib3.__version__); print('::warning::Bundled TLS backend is ' + b + ', which urllib3 v2 does not fully support (needs OpenSSL 1.1.1+)') if ('LibreSSL' in b or b < 'OpenSSL 1.1.1') else print('TLS backend OK')"

      - name: Build with PyInstaller (Apple Silicon, arm64)
        run: pyinstaller pynetboot-macos.spec --noconfirm --clean --distpath dist/macos

      - name: Create ZIP (Primary - No Gatekeeper issues)
        # The .app inside keeps its plain name: that is what appears in
        # Applications. Only the download carries the version.
        run: |
          cd dist/macos
          zip -r ${{ env.APP_NAME }}-${VER}.zip ${{ env.APP_NAME }}.app

      - name: Create DMG (with volume icon)
        run: |
          APP="dist/macos/${{ env.APP_NAME }}.app"
          ICNS="src/pynetboot/resources/icons/unetbootin.icns"
          DMG="dist/macos/${{ env.APP_NAME }}-${VER}.dmg"
          # Build a styled DMG whose mounted volume carries the app icon and a
          # drag-to-Applications shortcut. Falls back to a plain compressed DMG
          # if the icon/volume tooling misbehaves, so a release is never blocked.
          build_styled_dmg() {
            rm -rf dmg_stage dist/macos/rw.dmg
            mkdir -p dmg_stage
            cp -R "$APP" dmg_stage/
            ln -s /Applications dmg_stage/Applications
            cp "$ICNS" dmg_stage/.VolumeIcon.icns
            hdiutil create -volname "PyNetboot" -srcfolder dmg_stage \
              -fs HFS+ -format UDRW -ov -o dist/macos/rw.dmg
            MOUNT="$(hdiutil attach -readwrite -noverify -noautoopen dist/macos/rw.dmg | grep -Eo '/Volumes/[^ ]+' | head -1)"
            SetFile -a C "$MOUNT"
            hdiutil detach "$MOUNT"
            hdiutil convert dist/macos/rw.dmg -format UDZO -imagekey zlib-level=9 -ov -o "$DMG"
            rm -f dist/macos/rw.dmg
            rm -rf dmg_stage
          }
          build_styled_dmg || hdiutil create -volname "PyNetboot" -srcfolder "$APP" -format UDZO -ov -o "$DMG"
          ls -lh "$DMG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          # Ship only the ZIP and the DMG (not the raw .app directory). The
          # release attaches each of these as a standalone asset — the DMG is a
          # plain .dmg, not wrapped in a zip.
          name: ${{ env.APP_NAME }}-macos
          path: |
            dist/macos/${{ env.APP_NAME }}-*.zip
            dist/macos/${{ env.APP_NAME }}-*.dmg
          retention-days: 14

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version
        # The built files carry the version, the way the DEB and RPM do: from
        # the tag on a release, from the packaged __version__ otherwise.
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynetboot/__init__.py)"
          fi
          echo "VER=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "Artifacts will be named after version ${VER:-0.0.0}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.0.0
          sudo apt-get update
          # Tk itself must be present so tkinter imports and PyInstaller can
          # bundle libtcl/libtk into the artifact (no runtime dependency on
          # the user's machine).
          sudo apt-get install -y python3-tk tk8.6 patchelf wget
          # AppImage tooling needs libfuse2 at runtime. Ubuntu 24.04 renamed
          # the package to libfuse2t64; fall back to libfuse2 on older runners.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Verify GUI toolkit is bundled and usable
        shell: bash
        # CustomTkinter paints on canvases that need Tk 8.6; on older Tk the
        # window opens but stays blank. Fail the build here rather than ship a
        # binary that shows an empty window.
        run: |
          python - <<'PYEOF'
          import os, platform, sys, tkinter
          import customtkinter
          patchlevel = tkinter.Tcl().call('info', 'patchlevel')
          python_version = platform.python_version()
          print(f"python {python_version}  Tk {patchlevel}  "
                f"customtkinter {customtkinter.__version__}")
          # Every job writes the same row, so one glance at the run summary
          # shows whether the platforms bundled the same libraries.
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as handle:
                  handle.write(
                      f"### Toolkit bundled on {os.environ.get('RUNNER_OS', '?')}\n\n"
                      f"| python | Tk | customtkinter |\n|---|---|---|\n"
                      f"| {python_version} | {patchlevel} "
                      f"| {customtkinter.__version__} |\n")
          if tuple(int(n) for n in patchlevel.split('.')) < (8, 6, 13):
              print(f"::warning::Bundled Tk is {patchlevel}; 8.6.13+ is wanted "
                    f"for Aqua mouse handling on macOS")
          if float(tkinter.TkVersion) < 8.6:
              sys.exit(f"Tk 8.6+ required, found {tkinter.TkVersion}")
          PYEOF
          # The TLS stack gets bundled into the artifact, so record which one
          # and flag the combination urllib3 v2 does not support.
          python -c "import ssl, urllib3; b = ssl.OPENSSL_VERSION; print('TLS backend:', b, '| urllib3', urllib3.__version__); print('::warning::Bundled TLS backend is ' + b + ', which urllib3 v2 does not fully support (needs OpenSSL 1.1.1+)') if ('LibreSSL' in b or b < 'OpenSSL 1.1.1') else print('TLS backend OK')"

      - name: Build with PyInstaller
        run: pyinstaller pynetboot.spec --noconfirm --clean --distpath dist/linux-appimage

      - name: Create AppImage
        # The AppDir contains files reported as more than one architecture, so
        # appimagetool can't infer the target. Pin it explicitly.
        env:
          ARCH: x86_64
          # Pin the output filename; otherwise the plugin derives it from the
          # desktop-file Name ("PyNetboot"), which the mv glob below misses.
          OUTPUT: ${{ env.APP_NAME }}.AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/linux-appimage/${{ env.APP_NAME }} AppDir/usr/bin/
          cp resources/linux/pynetboot-appimage.desktop AppDir/usr/share/applications/${{ env.APP_NAME }}.desktop
          cp src/pynetboot/resources/icons/unetbootin_256.png AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_NAME }}.png
          mkdir -p AppDir/usr/share/${{ env.APP_NAME }}/resources
          cp -r src/pynetboot/resources/* AppDir/usr/share/${{ env.APP_NAME }}/resources/
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/${{ env.APP_NAME }} \
            --desktop-file AppDir/usr/share/applications/${{ env.APP_NAME }}.desktop \
            --icon-filename AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_NAME }}.png \
            --output appimage
          mv ${{ env.APP_NAME }}.AppImage dist/linux-appimage/${{ env.APP_NAME }}-${VER}.AppImage
          chmod +x dist/linux-appimage/${{ env.APP_NAME }}-${VER}.AppImage

      - name: Smoke-test the AppImage (must run self-contained)
        # Proves the bundle carries its own Python, Tcl/Tk and CustomTkinter:
        # the runner has no venv active here, so anything missing would crash.
        # A timeout means the GUI came up and stayed up, which is success.
        run: |
          sudo apt-get install -y xvfb
          # Record the application's own exit status to a file. xvfb-run
          # returns its own status, and exits 5 when it cannot remove its
          # temporary directory afterwards -- which masked the real result
          # and failed this step even though the GUI had come up fine.
          set +e
          xvfb-run -a bash -c '
            timeout 25 dist/linux-appimage/${{ env.APP_NAME }}-${VER}.AppImage
            echo $? > appimage-status
          '
          xvfb_code=$?
          set -e

          code="$(cat appimage-status 2>/dev/null || echo missing)"
          echo "application exit status: $code (xvfb-run itself returned $xvfb_code)"

          # 124 = timeout: still running after 25s, i.e. the window stayed open.
          if [ "$code" = "124" ]; then
            echo "AppImage started and kept running - bundle is self-contained."
          elif [ "$code" = "missing" ]; then
            echo "The application never reported a status; xvfb-run returned $xvfb_code"
            exit 1
          else
            echo "AppImage exited early with code $code"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-linux-appimage
          path: dist/linux-appimage/${{ env.APP_NAME }}-*.AppImage
          retention-days: 14

  build-linux-deb:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.0.0
          sudo apt-get update
          # Tk must be present so tkinter imports and PyInstaller can bundle
          # libtcl/libtk into the package (no runtime dependency on the user).
          sudo apt-get install -y python3-tk tk8.6 ruby ruby-dev rubygems build-essential rpm
          sudo gem install fpm -v 1.15.1

      - name: Verify GUI toolkit is bundled and usable
        shell: bash
        # CustomTkinter paints on canvases that need Tk 8.6; on older Tk the
        # window opens but stays blank. Fail the build here rather than ship a
        # binary that shows an empty window.
        run: |
          python - <<'PYEOF'
          import os, platform, sys, tkinter
          import customtkinter
          patchlevel = tkinter.Tcl().call('info', 'patchlevel')
          python_version = platform.python_version()
          print(f"python {python_version}  Tk {patchlevel}  "
                f"customtkinter {customtkinter.__version__}")
          # Every job writes the same row, so one glance at the run summary
          # shows whether the platforms bundled the same libraries.
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as handle:
                  handle.write(
                      f"### Toolkit bundled on {os.environ.get('RUNNER_OS', '?')}\n\n"
                      f"| python | Tk | customtkinter |\n|---|---|---|\n"
                      f"| {python_version} | {patchlevel} "
                      f"| {customtkinter.__version__} |\n")
          if tuple(int(n) for n in patchlevel.split('.')) < (8, 6, 13):
              print(f"::warning::Bundled Tk is {patchlevel}; 8.6.13+ is wanted "
                    f"for Aqua mouse handling on macOS")
          if float(tkinter.TkVersion) < 8.6:
              sys.exit(f"Tk 8.6+ required, found {tkinter.TkVersion}")
          PYEOF
          # The TLS stack gets bundled into the artifact, so record which one
          # and flag the combination urllib3 v2 does not support.
          python -c "import ssl, urllib3; b = ssl.OPENSSL_VERSION; print('TLS backend:', b, '| urllib3', urllib3.__version__); print('::warning::Bundled TLS backend is ' + b + ', which urllib3 v2 does not fully support (needs OpenSSL 1.1.1+)') if ('LibreSSL' in b or b < 'OpenSSL 1.1.1') else print('TLS backend OK')"

      - name: Build with PyInstaller
        run: pyinstaller pynetboot.spec --noconfirm --clean --distpath dist/linux-deb

      - name: Create DEB package
        run: |
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/${{ env.APP_NAME }}
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/metainfo
          mkdir -p package/usr/share/doc/${{ env.APP_NAME }}
          for s in 16 32 48 128 256; do mkdir -p package/usr/share/icons/hicolor/${s}x${s}/apps; done
          cp dist/linux-deb/${{ env.APP_NAME }} package/usr/bin/
          chmod +x package/usr/bin/${{ env.APP_NAME }}
          cp -r src/pynetboot/resources/* package/usr/share/${{ env.APP_NAME }}/
          # Version from tag (v1.0.6 -> 1.0.6); on non-tag (manual) builds fall
          # back to the packaged __version__ rather than 0.0.0.
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynetboot/__init__.py)"
          fi
          VER="${VER:-1.0.1}"
          # Ship the reverse-DNS desktop entry, matching AppStream metainfo and
          # themed icons so GNOME Software shows the name, icon, license and
          # description instead of "Unknown License" with a generic icon.
          cp resources/linux/com.pynetboot.PyNetboot.desktop package/usr/share/applications/com.pynetboot.PyNetboot.desktop
          cp resources/linux/com.pynetboot.PyNetboot.metainfo.xml package/usr/share/metainfo/com.pynetboot.PyNetboot.metainfo.xml
          # Make sure the built version is listed in <releases>, otherwise the
          # store shows "No details for this release".
          python3 resources/linux/stamp-release.py "$VER" package/usr/share/metainfo/com.pynetboot.PyNetboot.metainfo.xml
          # dpkg-based tools read licensing from the copyright file, not from
          # fpm's --license field.
          cp resources/linux/deb/copyright package/usr/share/doc/${{ env.APP_NAME }}/copyright
          for s in 16 32 48 128 256; do cp src/pynetboot/resources/icons/unetbootin_${s}.png package/usr/share/icons/hicolor/${s}x${s}/apps/com.pynetboot.PyNetboot.png; done
          fpm -s dir -t deb \
            -n ${{ env.APP_NAME }} \
            -v "$VER" \
            --architecture amd64 \
            --maintainer "Janos Szenfner <szenfner@outlook.com>" \
            --description "Create bootable USB drives from ISO files" \
            --license "GPL-2.0-or-later" \
            --url https://github.com/${{ github.repository }} \
            --depends parted \
            --depends dosfstools \
            --depends sudo \
            --after-install "$GITHUB_WORKSPACE/resources/linux/deb/postinst" \
            -C package \
            -p dist/linux-deb/${{ env.APP_NAME }}-${VER}.deb \
            usr

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-linux-deb
          path: dist/linux-deb/${{ env.APP_NAME }}-*.deb
          retention-days: 14

  build-linux-rpm:
    name: Build Linux RPM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.0.0
          sudo apt-get update
          # Tk must be present so tkinter imports and PyInstaller can bundle
          # libtcl/libtk into the package (no runtime dependency on the user).
          sudo apt-get install -y python3-tk tk8.6 ruby ruby-dev rubygems build-essential rpm
          sudo gem install fpm -v 1.15.1

      - name: Verify GUI toolkit is bundled and usable
        shell: bash
        # CustomTkinter paints on canvases that need Tk 8.6; on older Tk the
        # window opens but stays blank. Fail the build here rather than ship a
        # binary that shows an empty window.
        run: |
          python - <<'PYEOF'
          import os, platform, sys, tkinter
          import customtkinter
          patchlevel = tkinter.Tcl().call('info', 'patchlevel')
          python_version = platform.python_version()
          print(f"python {python_version}  Tk {patchlevel}  "
                f"customtkinter {customtkinter.__version__}")
          # Every job writes the same row, so one glance at the run summary
          # shows whether the platforms bundled the same libraries.
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as handle:
                  handle.write(
                      f"### Toolkit bundled on {os.environ.get('RUNNER_OS', '?')}\n\n"
                      f"| python | Tk | customtkinter |\n|---|---|---|\n"
                      f"| {python_version} | {patchlevel} "
                      f"| {customtkinter.__version__} |\n")
          if tuple(int(n) for n in patchlevel.split('.')) < (8, 6, 13):
              print(f"::warning::Bundled Tk is {patchlevel}; 8.6.13+ is wanted "
                    f"for Aqua mouse handling on macOS")
          if float(tkinter.TkVersion) < 8.6:
              sys.exit(f"Tk 8.6+ required, found {tkinter.TkVersion}")
          PYEOF
          # The TLS stack gets bundled into the artifact, so record which one
          # and flag the combination urllib3 v2 does not support.
          python -c "import ssl, urllib3; b = ssl.OPENSSL_VERSION; print('TLS backend:', b, '| urllib3', urllib3.__version__); print('::warning::Bundled TLS backend is ' + b + ', which urllib3 v2 does not fully support (needs OpenSSL 1.1.1+)') if ('LibreSSL' in b or b < 'OpenSSL 1.1.1') else print('TLS backend OK')"

      - name: Build with PyInstaller
        run: pyinstaller pynetboot.spec --noconfirm --clean --distpath dist/linux-rpm

      - name: Create RPM package
        run: |
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/${{ env.APP_NAME }}
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/metainfo
          for s in 16 32 48 128 256; do mkdir -p package/usr/share/icons/hicolor/${s}x${s}/apps; done
          cp dist/linux-rpm/${{ env.APP_NAME }} package/usr/bin/
          chmod +x package/usr/bin/${{ env.APP_NAME }}
          cp -r src/pynetboot/resources/* package/usr/share/${{ env.APP_NAME }}/
          # Ship the reverse-DNS desktop entry, matching AppStream metainfo and
          # themed icons so GNOME Software shows the name, icon, license and
          # description instead of "Unknown License" with a generic icon.
          cp resources/linux/com.pynetboot.PyNetboot.desktop package/usr/share/applications/com.pynetboot.PyNetboot.desktop
          cp resources/linux/com.pynetboot.PyNetboot.metainfo.xml package/usr/share/metainfo/com.pynetboot.PyNetboot.metainfo.xml
          for s in 16 32 48 128 256; do cp src/pynetboot/resources/icons/unetbootin_${s}.png package/usr/share/icons/hicolor/${s}x${s}/apps/com.pynetboot.PyNetboot.png; done
          # Version from tag (v1.0.6 -> 1.0.6); on non-tag (manual) builds fall
          # back to the packaged __version__ rather than 0.0.0.
          VER="${GITHUB_REF_NAME#v}"
          STAMP_METAINFO=package/usr/share/metainfo/com.pynetboot.PyNetboot.metainfo.xml
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynetboot/__init__.py)"
          fi
          VER="${VER:-1.0.1}"
          # Make sure the built version is listed in <releases>, otherwise the
          # store shows "No details for this release".
          python3 resources/linux/stamp-release.py "$VER" "$STAMP_METAINFO"
          fpm -s dir -t rpm \
            -n ${{ env.APP_NAME }} \
            -v "$VER" \
            --architecture x86_64 \
            --maintainer "Janos Szenfner <szenfner@outlook.com>" \
            --description "Create bootable USB drives from ISO files" \
            --license "GPL-2.0-or-later" \
            --url https://github.com/${{ github.repository }} \
            --depends parted \
            --depends dosfstools \
            --depends sudo \
            --after-install "$GITHUB_WORKSPACE/resources/linux/rpm/postinst" \
            -C package \
            -p dist/linux-rpm/${{ env.APP_NAME }}-${VER}.rpm \
            usr

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-linux-rpm
          path: dist/linux-rpm/${{ env.APP_NAME }}-*.rpm
          retention-days: 14

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: test
    # Flatpak in CI is sandbox-sensitive and the least natural fit for a tool
    # that writes raw block devices. Don't let it block the release: if it
    # fails, the other artifacts still ship (see create-release's `if:`).
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version
        # The built files carry the version, the way the DEB and RPM do: from
        # the tag on a release, from the packaged __version__ otherwise.
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynetboot/__init__.py)"
          fi
          echo "VER=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "Artifacts will be named after version ${VER:-0.0.0}"

      - name: Stamp version into AppStream metadata
        # GNOME Software reads the version and release notes from the
        # AppStream <releases> element. The metainfo in the source tree
        # carries notes for the current release; this only adds an entry when
        # a tag is built that is not listed there yet.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynetboot/__init__.py)"
          fi
          VER="${VER:-1.0.1}"
          METAINFO="resources/linux/com.pynetboot.PyNetboot.metainfo.xml"
          python3 resources/linux/stamp-release.py "$VER" "$METAINFO"
          # Validate the metadata (non-fatal) so any issue that would stop
          # appstream-compose from embedding the license/description is visible.
          sudo apt-get update && sudo apt-get install -y appstream
          appstreamcli validate --no-net "$METAINFO" || true

      - name: Set up Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Use the per-user installation — the runner user cannot modify the
          # system-wide flatpak configuration (ConfigureRemote not allowed).
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08
          flatpak install --user -y flathub org.freedesktop.Sdk//24.08

      - name: Build Flatpak
        run: |
          mkdir -p build-flatpak dist/flatpak
          # The positional arg is the build directory; export to an ostree
          # repo with --repo so build-bundle has a repository to read.
          flatpak-builder --user --install-deps-from=flathub \
            --force-clean \
            --repo=build-flatpak/repo \
            build-flatpak/build \
            resources/linux/com.pynetboot.PyNetboot.json
          flatpak build-bundle \
            build-flatpak/repo \
            dist/flatpak/${{ env.APP_NAME }}-${VER}.flatpak \
            com.pynetboot.PyNetboot
          # `flatpak info` takes an installed app id, not a bundle path; just
          # confirm the bundle was written.
          ls -lh dist/flatpak/${{ env.APP_NAME }}-${VER}.flatpak

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-flatpak
          path: dist/flatpak/${{ env.APP_NAME }}-*.flatpak
          retention-days: 14

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux-appimage, build-linux-deb, build-linux-rpm, build-flatpak]
    # contents:write lets GITHUB_TOKEN create the release and generate notes;
    # actions:read lets download-artifact fetch this run's build artifacts.
    permissions:
      contents: write
      actions: read
    # Run once all builds have settled (always()), but only cut the release if
    # the five CORE artifacts succeeded. Flatpak is optional and must not block
    # the release; download-artifact still includes it if present.
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-linux-appimage.result == 'success' &&
      needs.build-linux-deb.result == 'success' &&
      needs.build-linux-rpm.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history and tags are needed to diff against the previous tag.
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          CURRENT="${GITHUB_REF_NAME}"
          # The tag reachable before this one, i.e. the previous release.
          PREV="$(git describe --tags --abbrev=0 "${CURRENT}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${CURRENT}"
            echo "Changelog range: $RANGE"
          else
            RANGE="${CURRENT}"
            echo "No previous tag; listing all commits"
          fi
          {
            echo 'notes<<CHANGELOG_EOF'
            # Subject lines only: the commit bodies are too verbose for notes.
            git log --no-merges --pretty=format:'* %s' "$RANGE" || true
            echo
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
          # An annotated tag's message is the release note written by hand;
          # prefer it over the commit list when there is one.
          {
            echo 'summary<<SUMMARY_EOF'
            git tag -l --format='%(contents:body)' "$CURRENT" || true
            echo
            echo 'SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "$PREV" ]; then
            echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: false

      - name: Add macOS README
        run: |
          mkdir -p artifacts/${{ env.APP_NAME }}-macos/
          cp resources/macos/README-macOS.md artifacts/${{ env.APP_NAME }}-macos/

      - name: Display artifact structure
        run: find artifacts/ -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: |
            ### What's Changed in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.summary }}

            <details>
            <summary>Commits in this release</summary>

            ${{ steps.changelog.outputs.notes }}

            </details>

            ### Packages

            - Windows: EXE with UAC manifest for admin elevation
            - macOS: .app bundle (Apple Silicon/arm64 only - not Intel), distributed as ZIP and DMG
            - Linux: AppImage, DEB, RPM, and Flatpak packages

            ### macOS Installation Notes
            
            The macOS app is **unsigned** (no Apple Developer certificate). 
            **First launch**: Right-click on PyNetboot in Applications → Open → Click Open in the security dialog.
            
            See `README-macOS.md` in the macOS artifact for detailed instructions.
            
            ### Installation
            
            Every file below is named `pynetboot-${{ github.ref_name }}`, minus the leading `v`.

            **Windows**: Run `pynetboot-<version>.exe` (UAC elevation required)
            **macOS**: 
            - ZIP: Extract and drag to Applications, then right-click → Open
            - DMG: Mount, drag to Applications, then right-click → Open
            **Linux**: 
            - AppImage: `chmod +x pynetboot-*.AppImage && ./pynetboot-*.AppImage`
            - DEB: `sudo dpkg -i pynetboot-*.deb`
            - RPM: `sudo rpm -i pynetboot-*.rpm`
            - Flatpak: `flatpak install pynetboot-*.flatpak`
          files: |
            artifacts/${{ env.APP_NAME }}-windows/*
            artifacts/${{ env.APP_NAME }}-macos/*
            artifacts/${{ env.APP_NAME }}-linux-appimage/*
            artifacts/${{ env.APP_NAME }}-linux-deb/*
            artifacts/${{ env.APP_NAME }}-linux-rpm/*
            artifacts/${{ env.APP_NAME }}-flatpak/*
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
